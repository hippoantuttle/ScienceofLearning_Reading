<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 독해 뷰어</title>
  <link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="ui-theme.css">
  <link rel="stylesheet" href="pdf-viewer.css">
  <script src="pdf-paragraphs.js" defer></script>
  <script src="pdf-units.js" defer></script>
  <script src="pdf-viewer.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div class="row">
      <h1>PDF 독해 뷰어</h1>
      <label for="pdf-file">PDF 파일</label>
      <input id="pdf-file" type="file" accept="application/pdf,.pdf">
      <span class="group" role="group" aria-label="읽기 범위">
        <label for="page-from">읽기 범위</label><input id="page-from" type="number" min="1" step="1" inputmode="numeric" disabled>
        <label for="page-to">~</label><input id="page-to" type="number" min="1" step="1" inputmode="numeric" disabled>
        <button id="apply-range" type="button" disabled>범위 적용</button>
      </span>
    </div>
    <div class="row doc-tools" id="doc-tools" hidden>
      <span class="group" role="group" aria-label="쪽 이동">
        <button id="page-prev" type="button" aria-label="이전 쪽">‹</button>
        <label for="page-number" class="sr-only">현재 쪽</label><input id="page-number" type="number" min="1" step="1" inputmode="numeric">
        <span id="page-count"></span>
        <button id="page-next" type="button" aria-label="다음 쪽">›</button>
      </span>
      <span class="group" role="group" aria-label="확대·축소">
        <button id="zoom-out" type="button" aria-label="축소">−</button>
        <label for="zoom-select" class="sr-only">배율</label>
        <select id="zoom-select">
          <option value="page-width">쪽 너비</option><option value="page-fit">쪽 맞춤</option><option value="auto">자동</option>
          <option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option>
          <option value="custom" hidden></option>
        </select>
        <button id="zoom-in" type="button" aria-label="확대">+</button>
      </span>
      <span class="group" role="search" aria-label="PDF 안에서 찾기">
        <label for="find-input" class="sr-only">PDF 안에서 찾기</label><input id="find-input" type="search" placeholder="PDF 안에서 찾기">
        <button id="find-prev" type="button" aria-label="이전 결과">▲</button><button id="find-next" type="button" aria-label="다음 결과">▼</button>
        <span id="find-count" aria-live="polite"></span>
      </span>
    </div>
    <div class="row">
      <p id="viewer-status" role="status" aria-live="polite">PDF 파일을 선택하세요. 파일은 이 컴퓨터에서만 열고 저장하거나 전송하지 않습니다. 텍스트가 있는 PDF만 지원합니다.</p>
    </div>
    <div class="row designate" id="designate-bar" hidden>
      <p class="hint">읽기 단위를 자동으로 나눴습니다. 그대로 「지정 완료」를 눌러도 됩니다. 바꾸려면 상자를 클릭하고, 여러 상자를 묶으려면 <kbd>Shift</kbd>+클릭(키보드 <kbd>Shift</kbd>+<kbd>Enter</kbd>)하세요.</p>
      <button id="units-auto" type="button">자동 지정으로 되돌리기</button>
      <button id="units-clear" type="button">모두 해제</button>
      <button id="confirm-extraction" type="button" class="primary">지정 완료</button>
    </div>
    <div class="row designate" id="ready-bar" hidden>
      <p class="hint">원본의 단위 번호표를 누르면 사이드 패널이 그 단위로 이동합니다.</p>
      <button id="edit-extraction" type="button" class="quiet">다시 지정 · 연결 해제</button>
    </div>
  </header>
  <div id="viewer-area">
    <div id="viewerContainer" tabindex="0" aria-label="PDF 원본"><div id="viewer" class="pdfViewer"></div></div>
    <div id="mask" class="mask" role="note" hidden>원문을 가렸습니다. 사이드 패널에서 기억나는 내용을 작성하세요.</div>
  </div>
</body>
</html>
